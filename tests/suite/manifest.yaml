# One entry per fixture. Fields:
#   id           directory under fixtures/
#   fixture      file inside that directory
#   description  what the case checks (shown in README.md)
#   covers       ids from failure_modes.yaml
#   tier         offline (default) | llm (needs credentials, --run-llm) | local (needs
#                sources.local.yaml, --run-local)
#   status       active (default) | xfail (whole case can't pass yet; needs xfail_reason)
#   xfail        optional map of check id -> reason, for checks the pipeline can't pass yet
#                (check ids: format, rows_in, fields_out, schema_valid, flagged:NAME,
#                not_flagged:NAME, field:NAME). strict: a fixed check fails the run until removed.
#   sheet        optional: sheet to extract from an .xlsx fixture
#   expect       properties checked by suite_lib.check (see there)
# README.md is generated from this file: python tests/suite/build_readme.py
- id: synthetic-redcap-types
  fixture: input.csv
  description: >-
    Hand-written REDCap dictionary with one of each field type: text with validation, radio,
    yesno, checkbox, calc, three slider label shapes, descriptive with HTML, notes and a
    piped field.
  covers: [redcap-detect, slider, calc, descriptive, html, count-parity]
  xfail:
    field:age: "REDCap Text Validation Min/Max are not mapped to constraints.minimum/maximum"
    field:pain_vas_text: "slider labels are parsed as choices and become constraints.enum"
    field:pain_vas_two: "slider labels are parsed as choices and become constraints.enum"
    field:pain_vas_anchor: "slider labels are parsed as choices and become constraints.enum"
    field:bmi: "calc formula is parsed as a choice and becomes constraints.enum"
    field:intro: "HTML is left in descriptions"
  expect:
    format: redcap
    rows_in: 14
    fields_out: [13, 14]   # a descriptive row may be kept or dropped; both are acceptable
    schema_valid: true
    fields:
      age: {type: integer, minimum: 18, maximum: 99}
      # A slider is always 0-100 and is never restricted to its endpoint labels, but the
      # labels themselves must survive (where they go is deliberately not asserted).
      pain_vas_text:
        type: [integer, number]
        minimum: 0
        maximum: 100
        no_enum: true
        labels_preserved: [No pain, Worst pain imaginable]
      pain_vas_two:
        type: [integer, number]
        minimum: 0
        maximum: 100
        no_enum: true
        labels_preserved: [None, Extremely]
      pain_vas_anchor:
        type: [integer, number]
        minimum: 0
        maximum: 100
        no_enum: true
        labels_preserved: [No Pain, Worst Pain]
      bmi: {no_enum: true}
      intro: {no_html: true}

# ---- REDCap excerpts of real dictionaries -------------------------------------------------
# Slider range: REDCap takes it from Text Validation Min/Max when set and otherwise uses 0-100.
- id: redcap-slider-minimal
  fixture: input.csv
  description: >-
    A whole small REDCap test project: two sliders (text endpoints with an empty middle label,
    and three text labels), both with a custom maximum of 6, plus a calc field whose formula
    contains a comma.
  covers: [redcap-detect, slider, calc, short-description, count-parity]
  xfail:
    field:slider_eg: "slider labels are parsed as choices and become constraints.enum; the slider range (Text Validation Min/Max, else 0-100) is not recorded"
    field:slider_mid_eg: "slider labels are parsed as choices and become constraints.enum; the slider range (Text Validation Min/Max, else 0-100) is not recorded"
    field:dps: "calc formula is parsed as pipe-separated choices and lands in constraints.enum (cut at the first comma if it has one)"
  expect:
    format: redcap
    rows_in: 11
    fields_out: 11
    schema_valid: true
    flagged: [time, dec]
    fields:
      slider_eg:
        type: [integer, number]
        minimum: 0
        maximum: 6
        no_enum: true
        labels_preserved: [Not confident, Very confident]
      slider_mid_eg:
        type: [integer, number]
        minimum: 0
        maximum: 6
        no_enum: true
        labels_preserved: [Disagree, Unsure, Agree]
      dps: {no_enum: true}

- id: redcap-html-checkbox
  fixture: input.csv
  description: >-
    REDCap survey dictionary with rich-text HTML in descriptive fields, two checkbox fields and
    two calc formulas (one multi-line with nested if/sum).
  covers: [redcap-detect, html, calc, descriptive, count-parity]
  xfail:
    rows_in: "detect counts physical lines, so cells with line breaks inflate row_count"
    field:patient_factsheet: "HTML is left in the description"
    field:question: "HTML is left in the description"
    field:exclusion_total: "calc formula is parsed as pipe-separated choices and lands in constraints.enum (cut at the first comma if it has one)"
    field:nrs_total: "calc formula is parsed as pipe-separated choices and lands in constraints.enum (cut at the first comma if it has one)"
  expect:
    format: redcap
    rows_in: 9
    fields_out: [6, 9]   # the three descriptive rows may be kept or dropped
    schema_valid: true
    fields:
      patient_factsheet: {no_html: true}
      question: {no_html: true}
      exclusion_total: {no_enum: true}
      nrs_total: {no_enum: true}

