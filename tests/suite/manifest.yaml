- id: redcap-all-types
  fixture: input.csv
  description: >-
    Excerpt with every REDCap field type of a large survey project: notes, dropdown, yesno,
    checkbox, file uploads, three sliders, calc formulas with piped arguments, and descriptive
    fields holding HTML (one is an empty div). Cells contain line breaks.
  covers: [redcap-detect, slider, calc, descriptive, html, short-description, count-parity]
  xfail:
    rows_in: "detect counts physical lines, so cells with line breaks inflate row_count"
    field:mri_vas_pre_i: "slider labels are parsed as choices and become constraints.enum; the slider range (Text Validation Min/Max, else 0-100) is not recorded"
    field:age: "calc formula is parsed as pipe-separated choices and lands in constraints.enum (cut at the first comma if it has one)"
    field:paindur: "calc formula is parsed as pipe-separated choices and lands in constraints.enum (cut at the first comma if it has one)"
    field:econsent_instructions_v5: "HTML is left in the description"
    field:pipe_consent1_v5: "HTML is left in the description"
  expect:
    format: redcap
    rows_in: 27
    fields_out: [24, 27]   # the three descriptive rows may be kept or dropped
    schema_valid: true
    flagged: [mri_qa_n, mri_qa_1y]
    fields:
      mri_vas_pre_i:
        type: [integer, number]
        minimum: 0
        maximum: 100
        no_enum: true
        labels_preserved: [No pain sensation, Most intense pain sensation imaginable]
      age: {no_enum: true}
      paindur: {no_enum: true}
      econsent_instructions_v5: {no_html: true}
      pipe_consent1_v5: {no_html: true}

