# A file already in the HEAL CSV layout (schemaVersion, constraints.enum, ...) is matched by a
# study-specific mapping and its HEAL columns are copied into `custom` instead of being mapped.
- id: already-heal-csv
  fixture: input.csv
  description: >-
    HEAL VLMD CSV (columns such as constraints.enum and schemaVersion). Names contain spaces
    and a percent sign (`mouse id`, `% withdrawal`). It should pass through with every HEAL
    column mapped to its schema property.
  covers: [already-heal, odd-names]
  xfail:
    "field:model": "HEAL columns (schemaVersion, constraints.enum) are copied into custom instead of being mapped"
  expect:
    rows_in: 8
    fields_out: 8
    names_present: ["mouse id", "% withdrawal"]
    fields:
      model: {custom_lacks: [schemaVersion, constraints.enum]}

- id: heal-template
  fixture: input.csv
  description: The HEAL CSV submission template with example rows (module, name, constraints.*, encodings).
  covers: [already-heal]
  xfail:
    "field:race": "constraints.enum and encodings are copied into custom instead of being mapped"
  expect:
    rows_in: 7
    fields_out: 7
    fields:
      race: {custom_lacks: [constraints.enum, encodings]}

- id: tab-delimited
  fixture: input.tab
  description: A HEAL-layout dictionary saved tab-separated with a .tab extension.
  covers: [delimiter]
  xfail:
    columns_include: "only comma is tried as a delimiter; the whole header is read as one column"
  expect:
    columns_include: [name, description, type]

- id: latin1-encoding
  fixture: input.csv
  description: >-
    CDE-layout CSV saved in Mac Roman (not UTF-8): curly quotes, an em dash and a non-breaking
    space are single high bytes. Decoded as Latin-1 they become `Ò`, `Ó`, `Ñ`, `Ê`.
  covers: [encoding]
  xfail:
    rows_in: "detect counts physical lines, so cells with line breaks inflate row_count"
    "field:empstat_2___1": "the file is decoded as Latin-1, so a Mac Roman non-breaking space becomes Ê"
    "field:PSEQworkScl": "the file is decoded as Latin-1, so Mac Roman curly quotes become Ò and Ó"
    "field:PHQFlngFailrScore": "the file is decoded as Latin-1, so a Mac Roman em dash becomes Ñ"
  expect:
    format: cde
    rows_in: 7
    fields_out: 7
    fields:
      empstat_2___1: {absent_text: ["Ê"]}
      PSEQworkScl: {absent_text: ["Ò", "Ó"]}
      PHQFlngFailrScore: {absent_text: ["Ñ"]}

