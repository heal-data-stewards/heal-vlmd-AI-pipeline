  description: >-
    REDCap fields with an empty label, a one-character label that only repeats a number, and
    calc fields with very short labels. Missing and unusable descriptions must be flagged for
    review, never filled in.
  covers: [redcap-detect, empty-description, short-description, calc, count-parity]
