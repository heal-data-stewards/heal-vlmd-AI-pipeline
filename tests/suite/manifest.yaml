- id: redcap-named-qualtrics
  fixture: input.xlsx
  sheet: master
  description: >-
    Workbook from a study that calls it a "Qualtrics data dictionary": the master sheet has the
    REDCap column layout but `Variable Name` instead of `Variable / Field Name`, and `string`
    as the field type. The format must be decided by the columns, not the file name.
  covers: [mislabelled-format, redcap-detect, count-parity]
  xfail:
    fields_out: "detect picks redcap (score 0.82) but convert fails: the name column is `Variable Name`, not `Variable / Field Name`"
    schema_valid: "no fields are produced; see fields_out"
  expect:
    format: redcap
    rows_in: 8
    fields_out: 8
    schema_valid: true

- id: redcap-messy-workbook
  fixture: input.xlsx
  sheet: HDP00429_BACPAC
  description: >-
    Workbook with a REDCap-derived dictionary that has only some of the REDCap columns (no
    `Field Type`, four empty trailing columns), choices written as `1: Male | 2: Female`, plus
    a comparison sheet, a hidden sheet and a leftover empty sheet. The sheet is pinned because
    the excerpt changes which sheet is "largest".
  covers: [redcap-detect, enum-variants, count-parity]
  xfail:
    format: "only some REDCap columns are present (no Field Type), the score is below the detection threshold and the format is reported unknown"
    fields_out: "not converted because the format is not detected"
    schema_valid: "not converted because the format is not detected"
    field:SEX: "not converted because the format is not detected"
  expect:
    format: redcap
    rows_in: 8
    fields_out: 8
    schema_valid: true
    fields:
      SEX:
        enum_labels: {"1": Male, "2": Female, "3": Unknown, "4": Intersex}
