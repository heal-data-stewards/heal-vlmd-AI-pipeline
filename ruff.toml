# Ruff config. The Ruff version is pinned in requirements-dev.txt and
# .github/workflows/ci.yml because Ruff's formatting and default rules change
# between releases; bump both together and re-run `ruff format .` in the same
# change.
target-version = "py311"
line-length = 100
extend-exclude = [".idea"]

[lint]
# Ruff's defaults, plus import sorting.
extend-select = ["I"]

[lint.per-file-ignores]
# A diagnostic script: it catches every error on purpose and sorts it by message.
"probe_azure.py" = ["BLE001"]
