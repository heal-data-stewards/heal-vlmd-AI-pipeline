name: Linked issue

# Fails a pull request whose description has no closing keyword (Closes/Fixes/Resolves #N
# or org/repo#N). A required check on main; see "Pull requests" in DEVELOPMENT.md.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check for a closing keyword
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/linked_issues.py check
